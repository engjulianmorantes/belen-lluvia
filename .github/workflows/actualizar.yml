name: Actualizar datos y publicar

on:
  schedule:
    - cron: "17 * * * *"      # cada hora: estaciones, IMERG, pronóstico y radar IDEAM
                              # (el radar solo se reprocesa si cambió el número de volúmenes del día)
  workflow_dispatch:
    inputs:
      radar:
        description: "Procesar radar en esta ejecución"
        type: boolean
        default: true
      fecha:
        description: "Día local AAAA-MM-DD a procesar (vacío = el más reciente de cada radar). Ej.: 2026-01-15 (Barrancabermeja + Carimagua + Guaviare)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Traer publicación actual (gh-pages) para conservar días de radar y estado IMERG
        run: |
          git fetch --depth 1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages || true
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            git worktree add pub origin/gh-pages
          else
            mkdir pub
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Copiar la PWA
        run: |
          rsync -a --delete --exclude data/ site/ pub/
          mkdir -p pub/data
          touch pub/.nojekyll

      - name: Ejecutar pipeline
        working-directory: pipeline
        env:
          OUT_DIR: ${{ github.workspace }}/pub/data
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          RADAR_FECHA: ${{ inputs.fecha }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.radar }}" = "true" ]; then
            python build.py
          else
            python build.py --sin-radar
          fi

      - name: Publicar en gh-pages (un solo commit, sin historial para no inflar el repo)
        working-directory: pub
        run: |
          rm -rf .git
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
